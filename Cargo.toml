[workspace]
members = ["src-tauri"]
resolver = "2"

[profile.dev.package."*"]
opt-level = 3

# `cargo tauri dev` is the normal local test path. Keeping the app itself at a
# modest optimization level makes microphone handling and the UI responsive
# without release-build iteration time.
[profile.dev]
opt-level = 1
debug = 1
# Incremental artifacts can produce unresolved anonymous LLVM symbols at link
# time on Windows/MSVC. Keep dev builds deterministic for the Tauri app.
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

