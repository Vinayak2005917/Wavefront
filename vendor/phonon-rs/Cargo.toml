[package]
edition = "2024"
name = "phonon-rs"
version = "0.1.3"
build = false
exclude = [
    "/website/",
    "/packaging/",
    "/.github/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Phonon-2 speech-to-text CLI (candle, CPU or CUDA)"
readme = "README.md"
keywords = [
    "speech-to-text",
    "asr",
    "phonon",
    "parakeet",
    "candle",
]
categories = [
    "multimedia::audio",
    "science",
    "command-line-utilities",
]
license = "Apache-2.0"
repository = "https://github.com/apiplant/phonon-rs"

[features]
cli = [
    "mic",
    "dep:clap",
    "dep:env_logger",
]
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
]
default = [
    "onnx",
    "dictate",
]
dictate = [
    "cli",
    "dep:evdev",
    "dep:core-graphics",
    "dep:core-foundation",
]
mic = [
    "dep:cpal",
    "dep:ctrlc",
]
onnx = []

[lib]
name = "phonon"
crate-type = [
    "rlib",
    "cdylib",
]
path = "src/lib.rs"

[[bin]]
name = "phonon"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "phonon-dictate"
path = "src/bin/phonon-dictate.rs"
required-features = ["dictate"]

[dependencies.anyhow]
version = "1.0.104"

[dependencies.candle-core]
version = "0.11"
default-features = false

[dependencies.candle-nn]
version = "0.11"
default-features = false

[dependencies.clap]
version = "4.6.7"
features = [
    "derive",
    "env",
]
optional = true

[dependencies.cpal]
version = "0.18.2"
optional = true

[dependencies.ctrlc]
version = "3.5.2"
optional = true

[dependencies.env_logger]
version = "0.11.11"
optional = true

[dependencies.half]
version = "2.7.1"

[dependencies.log]
version = "0.4.34"

[dependencies.num_cpus]
version = "1.17.0"

[dependencies.rayon]
version = "1.12.0"

[dependencies.realfft]
version = "3.5.0"

[dependencies.rubato]
version = "5.0.0"

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.151"

[dependencies.tar]
version = "0.4.46"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.symphonia]
version = "0.6.1"
features = ["all"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.ureq]
version = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.zstd]
version = "0.14.0"

[target.'cfg(target_arch = "wasm32")'.dependencies.console_error_panic_hook]
version = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.2"
features = ["js"]

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom3]
version = "0.3"
features = ["wasm_js"]
package = "getrandom"

[target.'cfg(target_arch = "wasm32")'.dependencies.js-sys]
version = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.ruzstd]
version = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "0.2"

[target.'cfg(target_os = "linux")'.dependencies.cpal]
version = "0.18.2"
features = ["pulseaudio"]
optional = true

[target.'cfg(target_os = "linux")'.dependencies.evdev]
version = "0.13"
optional = true

[target.'cfg(target_os = "macos")'.dependencies.core-foundation]
version = "0.10"
