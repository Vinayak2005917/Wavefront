[package]
name = "wavefront"
version = "0.1.0"
description = "Private, offline-first Windows dictation"
authors = ["Wavefront"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
phonon-rs = { version = "=0.1.3", default-features = false, features = ["mic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
ureq = "2"


